    post:
      operationId: user_messages_create
      description: "Create a message on the specified support message thread as the authenticated user. \n\nDefine either `body` or `url` in the request to create a message or attachment, respectively.\n\nAll monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.\n\n\n\n<i>How can we improve these docs?             <a href=\"mailto:docs+feedback@narmi.com\">Share your feedback.</a></i>"
      summary: Create a message in a thread
      parameters:
      - in: path
        name: thread_uuids
        schema:
          type: string
          pattern: ^[,0-9A-Za-z-]+$
        required: true
      tags:
      - threads
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
            examples:
              CreateMessageRequest:
                value:
                  body: hello world
                summary: Create message request
              CreateThreadfile/attachmentRequest:
                value:
                  url: https://bucket.s3.amazonaws.com/original/support/38A94057B31C44FDA5F6D0C64D6362E2/attached.file
                summary: Create threadfile/attachment request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
