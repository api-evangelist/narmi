- name: whatismyip
paths:
  /v1/whatismyip/:
    get:
      operationId: whatismyip_retrieve
      description: 'Returns the IP address of the client making the request.


        All monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.


        How can we improve these docs? Share your feedback.'
      summary: Retrieve IP address
      tags:
      - whatismyip
      security:
      - oauth2:
        - read
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ip:
                    type: string
                    format: ipv4
          description: ''
      x-stoplight:
        id: p3jscu29qxlvs
