                      note: ''
                      type: Branch Deposit
                      recurring: false
                  summary: List transactions using link cursor pagination.
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsNotFoundError'
              examples:
                AccountsNotFound:
                  value:
                    id: api_error
                    message: No Account matches the given query.
                  summary: The accounts listed in the request params do not exist.
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
              examples:
                InvalidSearchQuery:
                  value:
                    id: invalid_request_error
                    message: Only description, category, merchant, tag, note, location, check, account, settled, effective, amount, balance, and id can be compared.
                  summary: Specify a search field other than description, category, merchant, tag, note, location, check, account, settled, effective, amount, balance, id.
          description: ''
        '500':
          description: No response body
      x-stoplight:
        id: igasbtx9icdmf
  /v1/transactions/{uuid}/:
    get:
      operationId: transactions_retrieve
      description: 'Fetch a specified transaction.


        All monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.




        <i>How can we improve these docs?             <a href="mailto:docs+feedback@narmi.com">Share your feedback.</a></i>'
      summary: Retrieve transaction
      parameters:
      - in: query
        name: file_format
        schema:
          type: string
          enum:
          - pdf
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-z-]+$
        required: true
      tags:
      - transactions
      security:
      - oauth2:
        - banking:transactions:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsDetail'
            application/pdf:
              schema:
                type: string
                format: binary
                description: When passed 'pdf' as 'file_format', responds with pdf file
              examples:
                PDFFile:
                  value: '%PDF-1.4

                    %âãÏÓ

                    %%EOF'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: ''
      x-stoplight:
        id: bjrpdxrm6gfrb
    put:
      operationId: transactions_update
      description: 'Update fields for a specified transaction.


        All monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.




        <i>How can we improve these docs?             <a href="mailto:docs+feedback@narmi.com">Share your feedback.</a></i>'
      summary: Update transaction
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-z-]+$
        required: true
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTransactionRequest'
      security:
      - oauth2:
        - banking:transactions:write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsDetail'
          description: ''
        '422':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - message
                properties:
                  id:
                    type: string
                    example: invalid_request_error
                  message:
                    description: An error response detailing the field and the nature of the error.
                    oneOf:
                    - type: string
                    - type: object
                      additionalProperties: true
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
              examples:
                ObjectMessage:
                  value:
                    id: invalid_request_error
                    message:
                      recurring:
                      - Must be a valid boolean.
                  summary: Object message
                StringMessage:
                  value:
                    id: invalid_request_error
                    message: Message describing nature of error.
                  summary: String message
                ArrayMessage:
                  value:
                    id: invalid_request_error
                    message:
                    - field_name: Message describing nature of error.
                    - second_field_name: Second Message.
                  summary: Array message
          description: Invalid request response.
      x-stoplight:
        id: rd5mckx6lay4w
  /v1/transactions/{uuid}/images/:
    get:
      operationId: transactions_images_list
      description: 'Fetch the base 64 encoded front and back check images for a specified transaction. This endpoint may return 503 or 422 status codes when interacting with the 3rd party integration that manages these images.


        All monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.




        <i>How can we improve these docs?             <a href="mailto:docs+feedback@narmi.com">Share your feedback.</a></i>'
      summary: Retrieve transaction image
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9a-z-]+$
        required: true
      tags:
      - transactions
      security:
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionImagesResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - message
                properties:
                  id:
                    type: string
                    example: invalid_request_error
                  message:
                    description: An error response detailing the field and the nature of the error.
                    oneOf:
                    - type: string
                    - type: object
                      additionalProperties: true
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
              examples:
                StringMessage:
                  value:
                    id: invalid_request_error
                    message: No Transaction matches the given query.
                  summary: String message
                ObjectMessage:
                  value:
                    id: invalid_request_error
                    message:
                      field_name: Message describing nature of error.
                  summary: Object message
                ArrayMessage:
                  value:
                    id: invalid_request_error
                    message:
                    - field_name: Message describing nature of error.
                    - second_field_name: Second Message.
                  summary: Array message
          description: Invalid request response.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
              examples:
                CoreUnavailable:
                  value:
                    id: api_connection_error
                    message: Sorry, we were unable to process your request, please check back soon.
                  summary: Core Unavailable
          description: ''
      x-stoplight:
        id: 9gi5yfkax9kwr
components:
  schemas:
    AccountsNotFoundError:
      type: object
      properties:
        id:
          type: string
          default: api_error
        message:
          type: string
          default: No Account matches the given query.
      x-stoplight:
        id: g7fiwt5ax5keg
    NotFoundError:
      type: object
      properties:
        id:
          type: string
          default: not_found
        message:
          type: string
          description: An error response detailing the nature of the error.
      required:
      - message
      x-stoplight:
        id: qazjpvfdteybw
    InvalidRequestError:
      type: object
      properties:
        id:
          type: string
          default: invalid_request_error
        message:
          type: object
          additionalProperties: {}
          default:
            field_name: Error description.
          description: An error response detailing the field and the nature of the error.
      x-stoplight:
        id: aelrw6rc7wiph
    PageNumberPagination:
      type: object
      properties:
        next:
          type: string
          format: uri
          nullable: true
          description: Link to the next results page.
        previous:
          type: string
          format: uri
          nullable: true
          description: Link to the previous results page.
      required:
      - next
      - previous
      x-stoplight:
        id: t59wt6qqevd5i
    Location:
      type: object
      properties:
        city:
          type: string
          readOnly: true
        region_code:
          type: string
          readOnly: true
        country_code:
          type: string
          readOnly: true
      x-stoplight:
        id: ohkm53zydll3a
    Transaction:
      type: object
      description: Representation of a non-pending monetary transaction.
      properties:
        description:
          type: string
          readOnly: true
          description: Customer-facing description of the transaction. Typically an abridged version of the full description.
        raw_description:
          type: string
          readOnly: true
          description: Full description of the transaction.
        id:
          type: string
          readOnly: true
          description: UUID of the transaction.
        source:
          type: string
          readOnly: true
          description: Type of transaction typically starts with a value such as "withdrawal", "transfer", "deposit", "dividend", "fee", "loan_distribution", "loan_payment", and concatenated with a detail such as "ACH", "ATM", "Bill Payment", "Card", "Cash", "Check", "Draft", "Fee", "Home Banking", "Point of Sale".
        settled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Date-time the transaction was settled. Null for non-final transactions.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: Date-time when the transaction was created in the database.
        account_id:
          type: string
          readOnly: true
          description: UUID of the account.
        category:
          type: string
          readOnly: true
          description: Category of the transaction. Defaults to `"Unknown"`.
        sub_category:
          type: string
          readOnly: true
          nullable: true
          description: Sub-category of the transaction. Defaults to empty string `""`.
        amount:
          example: 100
          maximum: 1000000000000000
          minimum: -1000000000000000
          description: Total amount of the transaction.
          type: integer
          readOnly: true
        ledger_balance:
          example: 100
          maximum: 1000000000000000
          minimum: -1000000000000000
          description: New balance as of this transaction.
          type: integer
          readOnly: true
          nullable: true
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
          readOnly: true
          description: Geographic location where the transaction was executed.
        check:
          allOf:
          - $ref: '#/components/schemas/Check'
          readOnly: true
          description: Details for the check related to a transaction.
        tags:
          type: array
          items:
            type: string
          default: []
          description: A list of user-defined tags associated with the transaction.
        merchant:
          type: string
          readOnly: true
          description: Merchant associated with the transaction. This is often set to empty string `""`.
        metadata:
          type: object
          additionalProperties: {}
          readOnly: true
          description: Supplemental information associated with the account. This is often set to an empty object `{}`.
        note:
          type: string
          default: ''
          description: Notes about the transaction set by the user.
          maxLength: 300
        type:
          description: Type of transaction (e.g. loan, withdrawal). Can contain additional details about the transaction type.
          nullable: true
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/Type61cEnum'
          - $ref: '#/components/schemas/NullEnum'
        recurring:
          type: boolean
          default: false
          description: Whether this is a recurring transaction.
        flex_plan_eligible:
          type: boolean
          readOnly: true
          description: Whether this transaction is eligible for Flex Plan.
      x-stoplight:
        id: vdnfwxifwddg1
    TransactionResponseMeta:
      type: object
      properties:
        total:
          type: integer
          description: Total number of results.
        warning_id:
          type: string
          default: pending_transactions_failure
          description: Unique string indicating the warning raised during the request.
        warning_message:
          type: string
          default: Pending transactions could not be fetched for some accounts.
          description: Human-readable description of the warning raised.
      required:
      - total
      x-stoplight:
        id: ub6yse2o1e9au
    TransactionImagesResponse:
      type: object
      properties:
        check_images:
          type: array
          items:
            $ref: '#/components/schemas/CheckImage'
      required:
      - check_images
      x-stoplight:
        id: zklspzyfcxa9y
    TransactionsResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        links:
          $ref: '#/components/schemas/PageNumberPagination'
        meta:
          allOf:
          - $ref: '#/components/schemas/TransactionResponseMeta'
          description: Metadata about the response, including the total number of results and any warnings that may have surfaced during the request.
      required:
      - links
      - meta
      - transactions
      x-stoplight:
        id: kmnmughdcnwys
    Type61cEnum:
      enum:
      - credit
      - debit
      type: string
      x-stoplight:
        id: zppwuboksqgcu
    TransactionsDetail:
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/Transaction'
      required:
      - transaction
      x-stoplight:
        id: gz3wbl23stt5k
    Check:
      type: object
      properties:
        number:
          type: string
          readOnly: true
          description: Sequential number of the check used for bookkeeping.
      x-stoplight:
        id: julrfoba1ef2k
    CheckImage:
      type: object
      properties:
        front:
          type: string
          readOnly: true
          description: A base 64 encoded image of the front of the check
          example: 
        back:
          type: string
          readOnly: true
          description: A base 64 encoded image of the back of the check
          example: 
      x-stoplight:
        id: a3swngzvihlce
    PatchedTransactionRequest:
      type: object
      description: Representation of a non-pending monetary transaction.
      properties:
        tags:
          type: array
          items:
            type: string
            minLength: 1
          default: []
          description: A list of user-defined tags associated with the transaction.
        note:
          type: string
          default: ''
          description: Notes about the transaction set by the user.
          maxLength: 300
        recurring:
          type: boolean
          default: false
          description: Whether this is a recurring transaction.
      x-stoplight:
        id: qrykodjaphbqk
    NullEnum:
      enum:
      - null
      x-stoplight:
        id: 2493tmzk9db0y
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /v2/oauth/authorize/
          tokenUrl: /v2/oauth/token/
          scopes:
            banking:accounts:read: Can read account information.
            banking:transactions:read: Can read transaction information.
            banking:scheduled_transfers:read: Can read scheduled transfer information.
            banking:scheduled_transfers:write: Can create and update scheduled transfers.
            banking:accounts:write: Can update account information.
            banking:transactions:write: Can update transaction information.
            banking:users:read: Can read user profile information.
            banking:products:read: Can read product information.
            banking:documents:read: Can read user statements and documents.
x-stoplight:
  id: 68n444msv6n7x
