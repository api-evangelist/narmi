openapi: 3.0.3
info:
  title: Narmi Public account balances cards API
  version: v1
  description: To read about Public API access and authentication, go to [API Overview](https://docs.narmi.com/docs/narmi-developer-docs/xl9dvbz84o11l-introduction).
  termsOfService: https://www.narmi.com/policies/developer-terms-conditions
  contact:
    name: Narmi Support
    email: support@narmi.com
servers:
- url: https://api.sandbox.narmi.dev/
  description: ''
tags:
- name: cards
paths:
  /v1/cards/:
    get:
      operationId: cards_list
      description: "List the user's cards. \n\nAll monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.\n\n\n\n<i>How can we improve these docs?             <a href=\"mailto:docs+feedback@narmi.com\">Share your feedback.</a></i>"
      summary: List cards for a user
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - cards
      security:
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCardInfoList'
              examples:
                READ:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: '1'
                      name: Standard Rewards
                      last_four_digits: '4692'
                      shipping:
                        address:
                          street_address: 96484 Donald Squares
                          street_address_2: ''
                          city: Lewishaven
                          region_code: MN
                          postal_code: '83505'
                          country_code: US
                          type: primary
                        method: ''
                        shipped_on: '2024-05-24'
                      network: Visa
                      state: normal
                      image: <svg>...</svg>
                      text_color: '#FFFFFF'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
              examples:
                PermissionDenied:
                  value:
                    id: permission_denied
                    message: You do not have permission to perform this action.
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
              examples:
                NotFound:
                  value:
                    id: not_found
                    message: Not found.
          description: ''
        '500':
          description: Server side error. Typically an issue related to connecting to the core or a third-party API.
      x-stoplight:
        id: wqvit71pccxzo
  /v1/cards/{card_id}/:
    get:
      operationId: cards_retrieve
      description: "Retrieve specified card. \n\nAll monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.\n\n\n\n<i>How can we improve these docs?             <a href=\"mailto:docs+feedback@narmi.com\">Share your feedback.</a></i>"
      summary: Retrieve specified card
      parameters:
      - in: path
        name: card_id
        schema:
          type: string
        required: true
      tags:
      - cards
      security:
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardInfo'
              examples:
                READ:
                  value:
                    id: '1'
                    name: Standard Rewards
                    last_four_digits: '4692'
                    shipping:
                      address:
                        street_address: 96484 Donald Squares
                        street_address_2: ''
                        city: Lewishaven
                        region_code: MN
                        postal_code: '83505'
                        country_code: US
                        type: primary
                      method: ''
                      shipped_on: '2024-05-24'
                    network: Visa
                    state: normal
                    image: <svg>...</svg>
                    text_color: '#FFFFFF'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
              examples:
                PermissionDenied:
                  value:
                    id: permission_denied
                    message: You do not have permission to perform this action.
          description: ''
        '500':
          description: Server side error. Typically an issue related to connecting to the core or a third-party API.
      x-stoplight:
        id: 1kxqohlsv7zwo
    put:
      operationId: cards_update
      description: "Activate and deactivate a specified card. \n\nAll monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.\n\n\n\n<i>How can we improve these docs?             <a href=\"mailto:docs+feedback@narmi.com\">Share your feedback.</a></i>"
      summary: Activate or deactivate card
      parameters:
      - in: path
        name: card_id
        schema:
          type: string
        required: true
      tags:
      - cards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CardRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CardRequest'
        required: true
      security:
      - oauth2:
        - write
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyUpdateCardResponse'
              examples:
                Read:
                  value:
                    card:
                      id: card_id
                      core_user_id: '1'
                      bin: '123412'
                      last_four_digits: '1234'
                      state: active
                      svg: <svg>...</svg>
                      is_card_number_on_front: 'True'
                      card_text_color: '#FFFFFF'
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
              examples:
                PermissionDenied:
                  value:
                    id: permission_denied
                    message: You do not have permission to perform this action.
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
              examples:
                NotFound:
                  value:
                    id: not_found
                    message: Not found.
          description: ''
        '422':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
              examples:
                ErrorExample:
                  value:
                    id: invalid_request_error
                    message: state
          description: ''
        '406':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
              examples:
                NotAcceptable:
                  value:
                    id: not_acceptable
                    message: Deprecated update endpoint supports only versions <= 16.
                  description: Endpoint deprecated for version 17+
          description: Endpoint deprecated for version 17+
        '500':
          description: Server side error. Typically an issue related to connecting to the core or a third-party API.
      x-stoplight:
        id: dxhbislydke4r
