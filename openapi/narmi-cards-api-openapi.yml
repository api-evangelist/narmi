components:
  schemas:
    Address:
      type: object
      properties:
        street_address:
          type: string
        street_address_2:
          type: string
        city:
          type: string
        region_code:
          type: string
          description: A region, province, parish, or any kind of subdivision represented by up to 3 characters. Typically an ISO 2-character state code.
        postal_code:
          type: string
          description: Typically a five-digit numeric US ZIP Code.
        country_code:
          type: string
          description: An ISO 3166-1 alpha-2 country code.
        type:
          type: string
      required:
      - city
      - postal_code
      - region_code
      - street_address
      x-stoplight:
        id: xatva1xwqb0yk
    CardShippingInfo:
      type: object
      description: integrations.cards.api_messages.Shipping
      properties:
        address:
          $ref: '#/components/schemas/Address'
        method:
          type: string
        shipped_on:
          type: string
          format: date
          nullable: true
      required:
      - address
      - method
      x-stoplight:
        id: d3dtn5mecxm9n
    RecurringTransaction:
      type: object
      properties:
        id:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        category_code:
          type: string
        transaction_date:
          type: string
          format: date
        merchant_name:
          type: string
        subscription_id:
          type: string
          format: uuid
      required:
      - amount
      - category_code
      - id
      - merchant_name
      - subscription_id
      - transaction_date
      x-stoplight:
        id: ldemqix6pa0tc
    CardSubscriptionsAndTransactions:
      type: object
      properties:
        monthly_transactions:
          type: array
          items:
            $ref: '#/components/schemas/CardTransactionsByMonth'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/CardSubscriptions'
      required:
      - monthly_transactions
      - subscriptions
      x-stoplight:
        id: gri4ifgvdrsvw
    CardRequest:
      type: object
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/CardStateEnum'
          description: 'Indicates whether the card is functional.


            * `active` - active

            * `inactive` - inactive'
      required:
      - state
      x-stoplight:
        id: lvdyknsgnuyu5
    CardTravelNote:
      type: object
      description: For getting and setting integrations.cards.api_messages.CardTravelNote
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - end_date
      - start_date
      x-stoplight:
        id: llgatlkhvo1zf
    CardSubscriptions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,2})?$
        category_code:
          type: string
        merchant_name:
          type: string
        state:
          $ref: '#/components/schemas/CardSubscriptionsStateEnum'
        recurrence_frequency:
          oneOf:
          - $ref: '#/components/schemas/RecurrenceFrequencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        next_payment_date:
          type: string
          format: date
          nullable: true
      required:
      - amount
      - category_code
      - id
      - merchant_name
      - next_payment_date
      - recurrence_frequency
      - state
      x-stoplight:
        id: tzfuauxjtqn3q
    PaginatedCardInfoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CardInfo'
      x-stoplight:
        id: l0ulmogdgptfu
    CardInfo:
      type: object
      description: integrations.cards.api_messages.CardInfo
      properties:
        id:
          type: string
          description: An identifier for the card object.
        name:
          type: string
          description: The card product's name.
        last_four_digits:
          type: string
          description: Last four digits of the card's account number.
        shipping:
          allOf:
          - $ref: '#/components/schemas/CardShippingInfo'
          description: Shipping information, not always populated.
        network:
          type: string
          nullable: true
          default: visa
          description: The credit card processing network, such as Visa, Discover, etc.
        state:
          allOf:
          - $ref: '#/components/schemas/StateBd5Enum'
          description: 'Indicates whether the card is functional, and if not for what reason.


            * `locked` - locked

            * `normal` - normal

            * `shipped` - shipped

            * `cancelled` - cancelled

            * `damaged` - damaged'
          readOnly: true
        image:
          type: string
          description: An image of the card or a placeholder image.
          readOnly: true
        text_color:
          type: string
          default: '#FFFFFF'
          description: Hex value indicating text color.
        card_type:
          type: string
          description: The card's type, debit, credit or atm.
      required:
      - card_type
      - id
      - last_four_digits
      - name
      x-stoplight:
        id: odrdkdiznuohw
    MissingCardRequest:
      type: object
      properties:
        reason:
          $ref: '#/components/schemas/ReasonEnum'
      required:
      - reason
      x-stoplight:
        id: htvopglvr495y
    CommonCard:
      type: object
      description: integrations.cards.common.Card
