        id:
          type: string
          description: An identifier for the card object.
        core_user_id:
          type: string
          description: String uniquely identifying a user or user's primary account on the banking core
        last_four_digits:
          type: string
          description: Last four digits of the card's account number.
        state:
          allOf:
          - $ref: '#/components/schemas/StateBd5Enum'
          description: 'Indicates whether the card is functional, and if not for what reason.


            * `locked` - locked

            * `normal` - normal

            * `shipped` - shipped

            * `cancelled` - cancelled

            * `damaged` - damaged'
          readOnly: true
        bin:
