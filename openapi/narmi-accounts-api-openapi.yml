    get:
      operationId: accounts_transactions_download_retrieve
      description: 'Export transaction history to a file.


        Custom date range can be defined by specifying the `period` parameter as `custom`.


        Some validation errors (e.g. when specifying a min date which is greater than a max date) may result in malformatted error responses.


        Please note that the response headers do not indicate the proper response content type.


        All monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.




        <i>How can we improve these docs?             <a href="mailto:docs+feedback@narmi.com">Share your feedback.</a></i>'
      summary: Get transactions download
      parameters:
      - in: path
        name: account_uuid
        schema:
          type: string
          pattern: ^[0-9A-Za-z-]+$
        required: true
      - in: query
        name: file_format
        schema:
          type: string
          enum:
          - csv
          - ofx
          - qbo
          - qfx
          - qif
        description: File format of the response.
      - in: query
        name: max_date
        schema:
          type: string
          format: date
        description: Upper bound date of format`YYYY-MM-DD` to filter transactions by when specifying `period` as `custom`.
      - in: query
        name: min_date
        schema:
          type: string
          format: date
        description: Lower bound date of format `YYYY-MM-DD` to filter transactions by when specifying `period` as `custom`.
      - in: query
        name: period
        schema:
          type: string
          enum:
          - current_month
          - current_year
          - custom
          - month
          - previous_month
          - previous_year
          - year
        description: Time period to filter transactions by.
      tags:
      - accounts
      security:
      - oauth2:
        - read
      responses:
        '200':
          description: File data in the specified format.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              examples:
