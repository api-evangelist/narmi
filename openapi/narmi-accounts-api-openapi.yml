      description: 'Verify the micro-deposit amounts for a specified external account. Additional information on micro-deposits/micro-entries and how they work can be found here https://www.nacha.org/micro-entries.


        In the event that the account does not exist or cannot be associated with the user, or ACH is not enabled, the endpoint will return a 404.


        In the event that the user does not have permission to modify the account, the endpoint will return a 403.


        All monetary values are represented in minor units, or the smallest unit of the currency with no decimal (e.g., cents). For example, $10.00 is represented as 1000.




        <i>How can we improve these docs?             <a href="mailto:docs+feedback@narmi.com">Share your feedback.</a></i>'
      summary: Run account verification
      parameters:
      - in: path
        name: uuid
        schema:
          type: string
          pattern: ^[0-9A-Za-z-]+$
        required: true
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAccountVerificationRequest'
            examples:
              ValidRequest:
                value:
                  amounts:
                  - 28
                  - 51
                summary: Valid request
              PermissionDenied:
                value:
                  id: api_error
                  message: User role does not have authorization for this action.
                summary: Permission denied
              AccountNotFound:
                value:
                  id: api_error
                  message: Not found.
                summary: Account not found
              InvalidInput:
                value:
                  id: invalid_request_error
                  message:
