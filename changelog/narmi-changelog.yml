notes: >-
  Narmi publishes a public, dated product changelog at new.narmi.com ("What's New
  at Narmi") as monthly "Product Highlights" posts in reverse-chronological order,
  tagged by product line (Narmi Grow, Narmi Banking, Narmi Command, Narmi Now,
  Narmi Open, etc.). Entries are dated by calendar month rather than semantic
  version numbers; archives extend back to at least 2021. This is a
  product-platform changelog, not an API-version changelog — the Narmi Public API
  itself is versioned via URI path (v1 / v2 oauth) and signals internal
  API-version deprecation through HTTP 406 responses (see lifecycle/).
