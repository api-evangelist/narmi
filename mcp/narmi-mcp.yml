description: Narmi launched the first Model Context Protocol (MCP) server deployed by a U.S. bank — in
  partnership with Grasshopper Bank in August 2025 — enabling business banking customers to query their
  financial data through LLMs including Claude and ChatGPT under OAuth 2.0-permissioned access. The MCP
  server is deployed per financial institution as part of Narmi AI / Narmi Open rather than as a single
  public hosted endpoint, so there is no global MCP URL to advertise. Access is gated by the same OAuth
  2.0 authorization-code scopes as the Public API (banking:accounts:read, banking:transactions:read, etc.),
  and all agentic workflows ship with human approval checkpoints, full audit trails, and bank-grade security.
  Models used do not train on institutional data.
